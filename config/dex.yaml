# Local stand-in IdP. Replace with your real OIDC provider (Google Workspace,
# Okta, Entra...) in gateway.yaml `oidc:` for anything beyond local dev.
#
# Dex's static-password connector does not emit groups, so group-scoped
# policies/caps can only be exercised against a real IdP. User-scoped and
# org-wide caps work fine locally.

issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

enablePasswordDB: true

staticClients:
  - id: claude-gateway
    name: Claude apps gateway
    secretEnv: OIDC_CLIENT_SECRET
    redirectURIs:
      - http://localhost:8791/oauth/callback

# Dev-only users. Password for both: "changeme"
staticPasswords:
  - email: alice@example.com
    hash: "$2a$10$9NmHLrdbBHmqmmhZMLFUWuQomH8KDiG32ySqwavASonK6EmF7wYJO"
    username: alice
    userID: 08a8684b-db88-4b73-90a9-3cd1661f5466
  - email: bob@example.com
    hash: "$2a$10$9NmHLrdbBHmqmmhZMLFUWuQomH8KDiG32ySqwavASonK6EmF7wYJO"
    username: bob
    userID: 41331323-6f44-45e6-b3b9-2c4b60c25222

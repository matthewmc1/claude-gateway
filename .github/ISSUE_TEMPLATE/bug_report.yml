name: Bug report
description: Something is broken or behaves differently from the docs
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems go through a private advisory, not here (see SECURITY.md).
        Please remove secrets, keys, internal hostnames and other people's email addresses from anything you paste.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api (budget app backend)
        - app (UI)
        - terraform
        - client (engineer install script)
        - deploy / local dev stack
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "e.g. v0.1.0 or a commit SHA"
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version, Terraform version, deployment (local stack, Cloud Run), and relevant APP_* settings (no secrets).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell

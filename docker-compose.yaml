# Local stack for the Claude apps gateway analytics layer.
#
# The gateway itself (`claude gateway`) runs natively on the host (see
# scripts/run-gateway.sh) so it can use your gcloud Application Default
# Credentials directly. Everything it talks to runs here.
#
#   postgres  - gateway state: device sign-in, spend ledger, audit, identity
#   dex       - stand-in OIDC IdP for local dev (swap for Google/Okta/Entra in prod)
#   otel      - OTLP receiver; the gateway relays client telemetry here
#   clickhouse- analytics store for metrics, logs (per-request events) and traces
#   grafana   - dashboards over ClickHouse (usage) and Postgres (spend)
#
# Host ports are offset from defaults to avoid clashing with other local services.

name: claude-gateway

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gateway
    ports: ["127.0.0.1:15432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gw -d gateway"]
      interval: 5s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    ports: ["127.0.0.1:5556:5556"]
    volumes: ["./config/dex.yaml:/etc/dex/config.yaml:ro"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:18123:8123"   # HTTP (Grafana, curl)
      - "127.0.0.1:19000:9000"   # native
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      retries: 10
    volumes: ["chdata:/var/lib/clickhouse"]

  otel:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-latest}
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports: ["127.0.0.1:4318:4318"]   # OTLP/HTTP, the gateway's telemetry.forward_to target
    user: "0"   # dev only: lets the file_storage extension write its offsets volume
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ./logs:/var/log/gateway:ro
      - otelstate:/var/lib/otelcol/storage
    depends_on:
      clickhouse: { condition: service_healthy }

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  chdata:
  grafanadata:
  otelstate:
